{{ define "main" }}
<h1>{{ .Title }}</h1>
<p class="subtitle post-meta">
  {{ with .Params.author }}
    <span class="post-meta__author">
      by <span class="post-meta__name">{{ . }}</span>
    </span>
  {{ end }}
  {{ with .Date }}
    <span class="post-meta__date">
      <time datetime="{{ .Format "2006-01-02" }}">
        {{ .Format "2 Jan 2006" }}
      </time>
    </span>
  {{ end }}
</p>

{{ .Content }}
{{ end }}
