{{ define "main" }}
{{- with .Content }}
{{ . }}
{{- end }}

<h2>Writing</h2>
<ul>
  {{- range .Site.RegularPages }}
  <li>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
    <time datetime="{{ .Date.Format `2006-01-02T15:04:05Z07:00` }}">
      {{ .Date.Format "January 2, 2006" }}
    </time>   
  </li>
  {{- end }}
</ul>
{{ end }}
