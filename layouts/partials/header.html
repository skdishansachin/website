<header class="site-header">
  <span class="site-header__title">{{ .Site.Params.siteName }}</span>
  <nav class="site-header__nav">
    {{ range .Site.Menus.main }}
      <a
        href="{{ .URL }}"
        {{ if eq $.RelPermalink .URL }}class="active"{{ end }}
      >
        {{ .Name }}
      </a>
    {{ end }}
  </nav>
</header>
