{{ define "main" }}
<div class="post-list">
  <ul class="post-list__items">
    {{- range .Pages }}
    <li class="post-list__item">
      <a class="post-list__link" href="{{ .Permalink }}">
        <span class="post-list__title">{{ .Title }}</span>
        <span class="post-list__divider"></span>
        <span class="post-list__date">{{ .Date.Format ($.Site.Params.dateFormat | default "2006-01-02") }}</span>
      </a>
    </li>
    {{- end }}
  </ul>
</div>
{{ end }}
