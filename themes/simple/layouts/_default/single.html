{{ define "main" }}
<article class="prose">
  <div class="prose__title">
    <h1>{{ .Title }}</h1>
    <div class="prose__meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format ($.Site.Params.dateFormat | default "2006-01-02") }}</time>
      <span class="prose__author">by {{ $.Site.Params.author }}</span>
    </div>
  </div>
  <div class="prose__content">
    {{ .Content }}
  </div>
</article>
{{ end }}
